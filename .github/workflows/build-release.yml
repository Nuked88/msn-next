name: Build release bundles

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      # Serializza i job: i 3 OS scrivono sulla stessa release draft; in
      # parallelo va in race sull'upload ("Not Found - releases/assets").
      # ponytail: max-parallel 1 = release affidabile ma ~3x più lenta;
      # se serve velocità, passare a un job unico di publish che assembla.
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
            rust-targets: ''
            bundles: --bundles nsis
            files: target/release/bundle/nsis/*.exe
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64
            rust-targets: ''
            bundles: --bundles deb,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - name: macOS Universal
            os: macos-latest
            artifact: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: --target universal-apple-darwin --bundles app,dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.tauri.outputs.appVersion }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Validate frontend
        working-directory: apps/desktop
        run: npm run check

      - name: Build native bundle
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          args: ${{ matrix.bundles }} ${{ github.event_name == 'pull_request' && '--config {"bundle":{"createUpdaterArtifacts":false}}' || '' }}
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && 'v__VERSION__' || '' }}
          releaseName: msnnext v__VERSION__
          releaseBody: Aggiornamento firmato di msnnext. L'app verifica automaticamente la disponibilità di nuove versioni ogni cinque ore.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msnnext-${{ steps.tauri.outputs.appVersion }}-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish signed update
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
