name: Build release bundles

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
            rust-targets: ''
            bundles: --bundles nsis
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64
            rust-targets: ''
            bundles: --bundles deb,appimage
          - name: macOS Universal
            os: macos-latest
            artifact: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: --target universal-apple-darwin --bundles dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Validate frontend
        working-directory: apps/desktop
        run: npm run check

      - name: Build native bundle
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          args: ${{ matrix.bundles }}

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msnnext-${{ steps.tauri.outputs.appVersion }}-${{ matrix.artifact }}
          path: target/**/bundle/**
          if-no-files-found: error
