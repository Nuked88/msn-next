name: Build release bundles

# Solo avvio manuale: sulle PR bastano test e svelte-check di ci.yml. Prima
# ogni push su una PR costruiva i bundle per tre sistemi e creava una release
# draft, intasando la coda dei runner (soprattutto macOS).
on:
  workflow_dispatch:

# Un nuovo avvio sullo stesso branch annulla quello vecchio.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Crea UNA sola release draft e ne esporta l'id. I job di build vi caricano
  # tramite releaseId invece di cercarla "by tag": così non dipendiamo dalla
  # consistenza read-after-write dell'API (che durante i disservizi GitHub
  # faceva sì che ogni job creasse una release separata, perdendo le altre).
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          # Riparti pulito: elimina una eventuale release/tag già presente.
          gh release delete "v$V" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$V" \
            -f target_commitish="${{ github.sha }}" \
            -f name="msnnext v$V" \
            -f body="Aggiornamento firmato di msnnext. L'app verifica automaticamente la disponibilità di nuove versioni ogni cinque ore." \
            -F draft=true -F prerelease=false -q .id)
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      # I tre job girano in parallelo: nessuno tocca latest.json, che viene
      # scritto una volta sola dal job publish.
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
            rust-targets: ''
            bundles: --bundles nsis
            files: target/release/bundle/nsis/*.exe
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64
            rust-targets: ''
            bundles: --bundles deb,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - name: macOS Universal
            os: macos-latest
            artifact: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: --target universal-apple-darwin --bundles app,dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Come in ci.yml: salva solo da main, così la cache resta riusabile.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Validate frontend
        working-directory: apps/desktop
        run: npm run check

      - name: Build native bundle
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          args: ${{ matrix.bundles }} ${{ github.event_name == 'pull_request' && '--config {"bundle":{"createUpdaterArtifacts":false}}' || '' }}
          # Carica tutti sulla stessa release creata dal job precedente.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json lo genera il job publish: caricato da ogni job in
          # parallelo andrebbe in race sullo stesso asset.
          includeUpdaterJson: false

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msnnext-${{ needs.create-release.outputs.version }}-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish signed update
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Upload updater latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime

          repo = os.environ["GITHUB_REPOSITORY"]
          release = os.environ["RELEASE_ID"]
          version = os.environ["VERSION"]

          def api(*args):
              return subprocess.run(["gh", "api", *args], check=True, capture_output=True, text=True).stdout

          assets = {a["name"]: a for a in json.loads(api(f"repos/{repo}/releases/{release}/assets", "--paginate"))}

          def entry(name):
              sig = api("-H", "Accept: application/octet-stream", assets[name + ".sig"]["url"]).strip()
              url = f"https://github.com/{repo}/releases/download/v{version}/{name}"
              return {"signature": sig, "url": url}

          exe = entry(f"msnnext_{version}_x64-setup.exe")
          appimage = entry(f"msnnext_{version}_amd64.AppImage")
          deb = entry(f"msnnext_{version}_amd64.deb")
          mac = entry("msnnext_universal.app.tar.gz")
          platforms = {
              "windows-x86_64": exe,
              "windows-x86_64-nsis": exe,
              "linux-x86_64": appimage,
              "linux-x86_64-appimage": appimage,
              "linux-x86_64-deb": deb,
              "darwin-aarch64": mac,
              "darwin-x86_64": mac,
              "darwin-aarch64-app": mac,
              "darwin-x86_64-app": mac,
          }
          pub_date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open("latest.json", "w") as f:
              json.dump({"version": version, "notes": "", "pub_date": pub_date, "platforms": platforms}, f, indent=2)
          PY
          cat latest.json
          # Upload per id: la release è ancora una bozza.
          gh api --method POST -H "Content-Type: application/json" --input latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" > /dev/null

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=false -F make_latest=true
