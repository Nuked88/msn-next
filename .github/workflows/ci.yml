name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rete di sicurezza: test del core e del protocollo, clippy su tutto il
  # workspace (desktop incluso) e type-check della UI. Gira su ogni PR, prima
  # e indipendentemente dalla build dei bundle.
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache Rust dependencies and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Test core e protocollo
        run: cargo test --workspace --exclude msnnext-desktop --locked

      - name: Test desktop
        run: cargo test -p msnnext-desktop --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  frontend:
    name: Frontend (svelte-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check
        working-directory: apps/desktop
        run: npm run check

      - name: Test
        working-directory: apps/desktop
        run: npm test
