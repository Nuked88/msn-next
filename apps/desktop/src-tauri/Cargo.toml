[package]
name = "msnnext-desktop"
version = "0.2.0"
description = "Desktop client for msnnext"
authors = ["msnnext contributors"]
license = "AGPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "msnnext_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.52.3", features = ["rt", "sync"], default-features = false }
msnnext = { version = "0.1.0", path = "../../cli" }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2"
libp2p-identity = { version = "0.2.14", features = ["peerid", "ed25519"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rqrr = "0.10.1"
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
blake3 = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
qrcode = "0.14.1"
